<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>Coin Hop</title>
    <style>
      html, body, #game { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #14162b; }
      body { touch-action: none; user-select: none; -webkit-user-select: none; }
      #touch { display: none; position: fixed; inset: auto 0 0 0; padding: 16px; justify-content: space-between; pointer-events: none; }
      #touch div { display: flex; gap: 12px; }
      #touch button {
        width: 72px; height: 72px; border: 2px solid #ffffff66; border-radius: 50%;
        background: #ffffff22; color: #fff; font-size: 26px; pointer-events: auto; touch-action: none;
      }
      #touch button.active { background: #ffffff66; }
      @media (pointer: coarse) { #touch { display: flex; } }
      #gf-retry, #gf-next {
        display: none; position: fixed; box-sizing: border-box; margin: 0; padding: 0;
        border: 2px solid #ffffff88; border-radius: 10px; background: #2e3560; color: #fff;
        font-family: 'Segoe UI', Arial, sans-serif; font-weight: bold; touch-action: none;
      }
      #gf-next { background: #2f8f4e; }
      #gf-next.locked { opacity: 0.55; }
      #gf-retry:active, #gf-next:active { filter: brightness(1.3); }
      body.game-gatefall #touch, body.game-slot-five #touch { display: none; }
      #sf-spin, #sf-new, #sf-help, #sf-help-close, #sf-fast {
        display: none; position: fixed; box-sizing: border-box; margin: 0; padding: 0;
        border: 2px solid #ffffff88; border-radius: 12px; background: #2e3560; color: #fff;
        font-family: 'Segoe UI', Arial, sans-serif; font-weight: bold; touch-action: none; line-height: 1.05;
      }
      /* Oval spin button (brief 4.9). */
      #sf-spin { background: #c0453a; border-radius: 50%; border-width: 3px; }
      #sf-spin.dim { opacity: 0.4; }
      #sf-new.highlight { background: #2f8f4e; border-color: #ffffff; }
      #sf-help { border-radius: 50%; }
      #sf-help.open { background: #4a56a0; border-color: #ffffff; }
      #sf-help-close { background: #3a2f60; z-index: 2; }
      /* Fast switch: off is navy with white text, on is yellow with dark text (both above 4.5:1). */
      #sf-fast { background: #2e3560; color: #ffffff; }
      #sf-fast.on { background: #ffe14d; color: #14162b; border-color: #ffffff; border-width: 3px; }
      #sf-spin:active, #sf-new:active, #sf-help:active, #sf-help-close:active, #sf-fast:active { filter: brightness(1.3); }
      /* Shown on every device in Slot Five: desktop mice click them too. The close button shows only with the legend. */
      body.game-slot-five #sf-spin, body.game-slot-five #sf-new, body.game-slot-five #sf-help, body.game-slot-five #sf-fast,
      body.game-slot-five #sf-help-close.show { display: block; }
      @media (pointer: coarse) {
        body.game-gatefall #gf-retry, body.game-gatefall #gf-next.show { display: block; }
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="touch">
      <div>
        <button id="btn-left" aria-label="Sang trái">◀</button>
        <button id="btn-right" aria-label="Sang phải">▶</button>
      </div>
      <div><button id="btn-jump" aria-label="Nhảy">▲</button></div>
    </div>
    <button id="gf-retry" type="button" aria-label="Thử lại">Thử lại</button>
    <button id="gf-next" type="button" aria-label="Màn kế">Màn kế</button>
    <button id="sf-spin" type="button" aria-label="Quay">QUAY</button>
    <button id="sf-new" type="button" aria-label="Trận mới">Trận mới</button>
    <button id="sf-help" type="button" aria-label="Chú giải icon" aria-expanded="false">?</button>
    <button id="sf-help-close" type="button" aria-label="Đóng chú giải">✕</button>
    <button id="sf-fast" type="button" aria-label="Quay nhanh" aria-pressed="false">Nhanh</button>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
